name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests plus integration tests against a real Postgres started by Testcontainers.
      - name: Test
        run: ./mvnw -B verify
      - name: Build Docker image
        run: docker build -t ledgerguard:${{ github.sha }} .
