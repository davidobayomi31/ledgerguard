# Runs the API and a Postgres database together: docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgerguard
      POSTGRES_USER: ledgerguard
      POSTGRES_PASSWORD: ledgerguard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerguard"]
      interval: 2s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ledgerguard
      DATABASE_USERNAME: ledgerguard
      DATABASE_PASSWORD: ledgerguard
      JWT_SECRET: local-docker-secret-change-me-please
    ports:
      - "8080:8080"
